<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Birthday Card for Han</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#080605;font-family:Arial,sans-serif;color:#fff}
#info{position:fixed;top:16px;left:16px;z-index:10;font-size:14px;background:rgba(0,0,0,0.4);padding:8px 12px;border-radius:8px}
#video{position:fixed;bottom:10px;right:10px;width:160px;height:auto;transform:scaleX(-1);opacity:0.7;border-radius:6px}
canvas{display:block}
</style>
</head>
<body>
<div id="info">Open your palm to open card ✋ | Close fist to close ✊ | Drag mouse to rotate</div>
<video id="video" autoplay playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
// ========== Audio ==========
const audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
audio.volume = 0.6;
let hasPlayedSong = false;

// ========== Three.js Setup ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070504);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 7);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 12;

// Lights
const ambientLight = new THREE.AmbientLight(0xffddaa, 0.35);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffb870, 1.2, 20);
pointLight.position.set(0,2,2);
scene.add(pointLight);

// Bloom / Glow helper (simple candle flare)
const flareGeo = new THREE.SphereGeometry(0.22,16,16);
const flareMat = new THREE.MeshBasicMaterial({color:0xffc470,transparent:true,opacity:0.22});
const flareMesh = new THREE.Mesh(flareGeo, flareMat);
flareMesh.position.set(0,1.8,0);
scene.add(flareMesh);

// ========== Card Geometry ==========
const cardGroup = new THREE.Group();
scene.add(cardGroup);
let openProgress = 0; // 0 closed, 1 fully open
const targetOpen = {val:0};

// Cover (front)
const coverGeo = new THREE.PlaneGeometry(3.2, 4.2);
const coverMat = new THREE.MeshStandardMaterial({color:0xfff3e8, side:THREE.DoubleSide});
const cover = new THREE.Mesh(coverGeo, coverMat);
cover.position.set(0,0,0);
cover.rotation.y = 0;
cardGroup.add(cover);

// Inside page
const insideGeo = new THREE.PlaneGeometry(3.2, 4.2);
const insideMat = new THREE.MeshStandardMaterial({color:0xfff8f0, side:THREE.DoubleSide});
const inside = new THREE.Mesh(insideGeo, insideMat);
inside.position.set(0,0,0.01);
cardGroup.add(inside);

// Hinge
const hingeGeo = new THREE.BoxGeometry(0.08,4.2,0.12);
const hingeMat = new THREE.MeshStandardMaterial({color:0xd4a880});
const hinge = new THREE.Mesh(hingeGeo, hingeMat);
hinge.position.set(-1.6,0,0);
cardGroup.add(hinge);

// Draw cake on cover via canvas texture
function createCakeTexture(){
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height=640;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle="#fff3e8";
  ctx.fillRect(0,0,512,640);
  // Cake
  ctx.fillStyle="#ff96b4";
  ctx.fillRect(140,360,230,140);
  ctx.fillStyle="#ffc252";
  ctx.fillRect(160,280,190,90);
  ctx.fillStyle="#78d8ff";
  ctx.fillRect(180,210,150,80);
  // Candle
  ctx.fillStyle="#ffffff";
  ctx.fillRect(240,140,32,70);
  ctx.fillStyle="#ff5533";
  ctx.beginPath();
  ctx.arc(256,126,18,0,Math.PI*2);
  ctx.fill();
  // Sprinkles
  ctx.fillStyle="#74ff9c";
  ctx.fillRect(170,400,12,12);
  ctx.fillStyle="#b474ff";
  ctx.fillRect(280,330,12,12);
  ctx.fillStyle="#ffdd44";
  ctx.fillRect(210,250,12,12);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}
coverMat.map = createCakeTexture();

// Inside text canvas
function createInsideTextTexture(){
  const canvas = document.createElement('canvas');
  canvas.width=512; canvas.height=640;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle="#fff8f0";
  ctx.fillRect(0,0,512,640);
  ctx.fillStyle="#442222";
  ctx.font="bold 42px Arial";
  ctx.textAlign="center";
  ctx.fillText("Dear Han,", 256, 180);
  ctx.fillText("Happy Birthday!", 256, 240);
  ctx.font="24px Arial";
  ctx.fillText("May every day bring you joy,",256,330);
  ctx.fillText("laughter and wonderful surprises.",256,370);
  ctx.fillText("Wish you all the best!",256,430);
  const tex = new THREE.CanvasTexture(canvas);
  return tex;
}
insideMat.map = createInsideTextTexture();

// ========== Confetti Hearts ==========
const hearts = [];
const heartGeo = new THREE.ShapeGeometry( (()=>{
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(0,-0.35,-0.6,-0.4,-0.6,0);
  shape.bezierCurveTo(-0.6,0.35,0,0.7,0,0.9);
  shape.bezierCurveTo(0,0.7,0.6,0.35,0.6,0);
  shape.bezierCurveTo(0.6,-0.4,0,-0.35,0,0);
  return shape;
})() );
const heartColors = [0xff4466,0xffcc33,0x44ddff,0x88ff66,0xdd77ff];

function spawnHearts(){
  for(let i=0;i<35;i++){
    const mat = new THREE.MeshStandardMaterial({
      color: heartColors[Math.floor(Math.random()*heartColors.length)],
      side:THREE.DoubleSide, transparent:true, opacity:0.9
    });
    const mesh = new THREE.Mesh(heartGeo, mat);
    mesh.position.set(0,0,0.15);
    mesh.userData = {
      vx:(Math.random()-0.5)*0.12,
      vy:Math.random()*0.1+0.06,
      vz:(Math.random()-0.5)*0.12,
      rotSpeed: (Math.random()-0.5)*0.08,
      life:1
    }
    hearts.push(mesh);
    scene.add(mesh);
  }
}

function updateHearts(delta){
  for(let i=hearts.length-1;i>=0;i--){
    const h = hearts[i];
    h.position.x += h.userData.vx;
    h.position.y += h.userData.vy;
    h.position.z += h.userData.vz;
    h.rotation.z += h.userData.rotSpeed;
    h.userData.life -= delta * 0.45;
    h.material.opacity = h.userData.life;
    if(h.userData.life <= 0){
      scene.remove(h); hearts.splice(i,1);
    }
  }
}

// ========== MediaPipe Hands ==========
const videoEl = document.getElementById('video');
const hands = new Hands({locateFile: (file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.7
});
hands.onResults(onHandResult);
new Camera(videoEl, {
  onFrame: async ()=>{ await hands.send({image:videoEl}) },
  width:640, height:480
}).start();

let isOpenHand = false;
function onHandResult(res){
  if(!res.multiHandLandmarks || res.multiHandLandmarks.length ===0){
    isOpenHand = false;
    return;
  }
  const lm = res.multiHandLandmarks[0];
  // Calculate finger spread: check fingertips above knuckles
  const thumbOpen = lm[4].x < lm[3].x;
  const indexOpen = lm[8].y < lm[6].y;
  const midOpen = lm[12].y < lm[10].y;
  const ringOpen = lm[16].y < lm[14].y;
  const pinkyOpen = lm[20].y < lm[18].y;
  isOpenHand = thumbOpen && indexOpen && midOpen && ringOpen && pinkyOpen;
}

// ========== Animation Loop ==========
const clock = new THREE.Clock();
let lastTriggerOpen = false;
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update();

  // Smooth open progress
  if(isOpenHand) targetOpen.val = 1;
  else targetOpen.val = 0;
  openProgress += (targetOpen.val - openProgress) * 3.2 * dt;

  // Card flip rotation (hinge at left side)
  cover.rotation.y = openProgress * Math.PI * 0.88;

  // Trigger once when open
  if(openProgress > 0.75 && !lastTriggerOpen){
    spawnHearts();
    if(!hasPlayedSong){
      audio.play().catch(e=>{});
      hasPlayedSong = true;
    }
  }
  lastTriggerOpen = openProgress > 0.75;

  // Candle flicker glow
  flareMesh.scale.setScalar(1 + Math.sin(clock.getElapsedTime()*7)*0.08);
  pointLight.intensity = 1.2 + Math.sin(clock.getElapsedTime()*6)*0.15;

  updateHearts(dt);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
